<!-- @dsCard group="Navigation" height=110 subtitle="Floating pill; the active tab expands with its label" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TabBar — preview</title>
<style>
html,body{margin:0}
body{background:var(--background);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pad{padding:20px 16px}
.bar{max-width:420px;display:flex;align-items:center;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);box-shadow:var(--shadow-raised)}
.tab{height:52px;width:46px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-muted);border:0;background:none;padding:0;cursor:pointer;flex:none}
.tab[aria-selected="true"]{flex:1;width:auto;padding:0 12px;background:var(--primary);color:var(--on-primary);border-radius:var(--radius-pill)}
</style>
</head>
<body>
<div class="pad"><nav class="bar" role="tablist" aria-label="Main">
  <button class="tab" role="tab" aria-selected="true"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="headline">Home</span></button>
  <button class="tab" role="tab" aria-selected="false" aria-label="Calendar"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
  <button class="tab" role="tab" aria-selected="false" aria-label="Insights"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></button>
  <button class="tab" role="tab" aria-selected="false" aria-label="Learn"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
  <button class="tab" role="tab" aria-selected="false" aria-label="Profile"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
</nav></div>
</body>
</html>
