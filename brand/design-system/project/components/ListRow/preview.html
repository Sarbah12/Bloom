<!-- @dsCard group="Navigation" height=240 subtitle="Settings rows: link and whole-row toggle" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ListRow — preview</title>
<style>
html,body{margin:0}
body{background:var(--background);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pad{padding:16px}
.card{max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.tile{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--on-primary-soft)}
.text{flex:1;min-width:0}
.sub{color:var(--ink-muted)}
.chev{color:var(--ink-subtle)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--switch-off);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--surface);box-shadow:0 2px 4px rgba(0,0,0,.18)}
.row[aria-checked="true"] .switch{background:var(--primary)}
.row[aria-checked="true"] .switch::after{left:22px}
</style>
</head>
<body>
<div class="pad"><div class="card">
  <div class="row" role="link" tabindex="0"><span class="tile"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span><span class="text"><span class="headline">Reminders</span><br><span class="footnote sub">Check-in at 8:00 PM</span></span><span class="chev"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></span></div>
  <div class="row" role="switch" aria-checked="true" tabindex="0"><span class="tile"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><span class="text"><span class="headline">App Lock</span><br><span class="footnote sub">Face ID when you open Bloom</span></span><span class="switch" aria-hidden="true"></span></div>
  <div class="row" role="link" tabindex="0"><span class="tile"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span><span class="text"><span class="headline">Export my data</span><br><span class="footnote sub">A file only you can open</span></span><span class="chev"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></span></div>
</div></div>
</body>
</html>
